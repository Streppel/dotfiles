## Não restaurar/persistir o último sink padrão escolhido manualmente.
##
## Com isso o WirePlumber escolhe automaticamente o melhor sink disponível
## a cada (des)conexão, usando a prioridade dos nós:
##   - Fone Bluetooth (priority.session = 1010)
##   - HDMI/analógico   (priority.session = 600)
## Resultado: ao conectar o fone, o áudio vai automaticamente para ele;
## ao desconectar, volta para o monitor.
##
## Uma escolha manual (pactl/wpctl set-default-sink) continua valendo durante
## a sessão atual, mas não fica "grudada" para sempre.
wireplumber.settings = {
  node.restore-default-targets = false
}