$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(13, 13, 20, 0.35)
    outer_color = rgb(118, 148, 106)
    check_color = rgb(220, 165, 97)
    fail_color = rgb(232, 36, 36)
    font_color = rgb(220, 215, 186)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = senha
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(220, 215, 186)
    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(114, 113, 105)
    position = -30, -150
    halign = right
    valign = top
}
